[versions]
kotlinJvm = "2.3.20"
kotlinxSerialization = "1.10.0"
coroutines = "1.10.2"
shadow = "9.4.1"
resourceFactoryPaper = "1.3.1"
canvasWeaverUserdev = "2.4.4"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinJvm" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinJvm" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resourceFactoryPaper" }
canvas-weaver-userdev = { id = "io.canvasmc.weaver.userdev", version.ref = "canvasWeaverUserdev" }
